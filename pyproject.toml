[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-api"
version = "0.1.0"
description = "A small, inspectable RAG learning project"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.8,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
pdf = ["pypdf>=5,<7"]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["evidence*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

